apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vk8s.gatewayServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vk8s.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with .Values.serviceAccount.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.rbac.create }}
---
# gateway 只需要 watch VirtualCluster 维护路由表
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vk8s-gateway
  labels:
    {{- include "vk8s.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: ["vk8s.io"]
    resources:
      - virtualclusters
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vk8s-gateway
  labels:
    {{- include "vk8s.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vk8s-gateway
subjects:
  - kind: ServiceAccount
    name: {{ include "vk8s.gatewayServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
