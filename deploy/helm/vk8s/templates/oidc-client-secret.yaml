{{- if and .Values.auth.oidc.enabled .Values.auth.oidc.clientSecret (not .Values.auth.oidc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vk8s.oidcSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vk8s.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
  {{- include "vk8s.annotations" . | nindent 2 }}
type: Opaque
data:
  clientSecret: {{ .Values.auth.oidc.clientSecret | b64enc | quote }}
{{- else if and .Values.auth.oidc.enabled (not .Values.auth.oidc.clientSecret) (not .Values.auth.oidc.existingSecret) }}
{{- fail "auth.oidc.enabled requires auth.oidc.clientSecret or auth.oidc.existingSecret" }}
{{- end }}
