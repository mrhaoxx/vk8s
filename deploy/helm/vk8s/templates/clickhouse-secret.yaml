{{- if and .Values.audit.enabled .Values.audit.clickhouse.deploy (not .Values.audit.clickhouse.existingSecret) }}
{{- /* 密码只在首次安装生成；升级时复用集群里已有的值 */ -}}
{{- $name := include "vk8s.clickhouseSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if and $existing $existing.data }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 24 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vk8s.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
  annotations:
    vk8s.io/description: "审计 ClickHouse 的用户密码（key: password）"
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  password: {{ $password | quote }}
{{- end }}
