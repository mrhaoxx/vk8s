{{- if and .Values.auth.bootstrapAdmin.enabled (not .Values.auth.bootstrapAdmin.existingSecret) }}
{{- /* 密码只在首次安装生成；升级时复用集群里已有的值，避免每次 upgrade 改密码 */ -}}
{{- $name := include "vk8s.bootstrapAdminSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := .Values.auth.bootstrapAdmin.password }}
{{- if and (not $password) $existing $existing.data }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 24 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vk8s.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
  annotations:
    # manager 首次启动读取明文并转为 bcrypt 写入 User 的密码 Secret；之后改密码走 UI
    vk8s.io/description: "bootstrap admin 明文密码（key: password）"
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}
