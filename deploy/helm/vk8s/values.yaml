# ---- 审计 ----
# 开启后：每个虚拟 apiserver 把审计事件（策略见 internal/audit/policy/policy.yaml）经 manager 写进 ClickHouse，
# manager API 的变更操作与登录也记录。开启或关闭会给各集群的证书 Secret 增删一个 key，触发控制平面滚动重启一次。
audit:
  enabled: false
  # ClickHouse TTL（天）
  retentionDays: 365
  clickhouse:
    # true：chart 部署一个单副本 ClickHouse（开发 / e2e 用）；生产请接外部实例并填 url
    deploy: false
    # 空且 deploy=true 时取 http://vk8s-clickhouse.<namespace>.svc:8123
    url: ""
    database: vk8s_audit
    username: vk8s
    # 含 key password 的 Secret 名（同 namespace）；deploy=true 且为空时自动生成 vk8s-clickhouse；deploy=false 时必填
    existingSecret: ""
    # 以下只在 deploy=true 时使用
    image: clickhouse/clickhouse-server:25.3
    storageSize: 20Gi
    storageClassName: ""
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi

# ---- 用户建集群时的默认值与上限（admin 可覆盖） ----
defaults:
  quota:
    cpu: "16"
    memory: 64Gi
    pods: 50
    storage: 200Gi
    services: 20
    extended: {}
  maxQuota:
    cpu: "256"
    memory: 2Ti
    pods: 500
    storage: 10Ti
    services: 200
    extended:
      nvidia.com/gpu: "32"
  # privileged | baseline | restricted
  podSecurity: privileged
  nodePlacement:
    nodeSelector: {}
    nodeNames: []
    tolerations: []
  controlPlane:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
    storageSize: 5Gi
    storageClassName: ""

# 控制平面 pod 自身落在哪些节点
controlPlanePlacement:
  nodeSelector: {}
  tolerations: []

# UI 下拉的填表捷径；CRD 存展开后的字段
nodePlacementPresets: []
#  - name: dev-pool-a
#    nodeSelector:
#      vk8s.io/pool: dev-a
#    tolerations:
#      - key: vk8s.io/pool
#        operator: Equal
#        value: dev-a
#        effect: NoSchedule

# 写进每个租户 ns 的 LimitRange
limitRange:
  defaultRequest:
    cpu: 100m
    memory: 128Mi
  default:
    cpu: "1"
    memory: 1Gi

# ---- 用户 Ingress 的泛证书 ----
# 启用后 manager 把 <Release ns>/<secretName> 复制进每个租户 ns，用户未写 tls 时自动补上。
# 证书本身由管理员或 cert-manager 提供，chart 不创建。
appsTLS:
  enabled: false
  secretName: apps-wildcard-tls

# ---- manager ----
manager:
  replicas: 1
  extraArgs: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # 探针路径（manager 在 8080 提供）
  probes:
    livenessPath: /healthz
    readinessPath: /readyz
  service:
    type: ClusterIP
    annotations: {}
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    # 空 = console.<apiDomain>
    host: ""
    tls:
      enabled: true
      # 已有 TLS Secret；配合 cert-manager 时在 annotations 里加 issuer 注解即可
      secretName: vk8s-console-tls

# ---- gateway ----
gateway:
  replicas: 2
  # 容器内监听端口；非 root 绑定 443 依赖 pod sysctl net.ipv4.ip_unprivileged_port_start=0
  listenPort: 443
  healthPort: 8081
  idleTimeout: 1h
  extraArgs: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    type: LoadBalancer
    annotations: {}
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    # Local 可保留客户端源 IP
    externalTrafficPolicy: Cluster
    # type=NodePort 时使用
    nodePort: null

# ---- 通用 ----
rbac:
  create: true
serviceAccount:
  manager:
    name: vk8s-manager
    annotations: {}
  gateway:
    name: vk8s-gateway
    annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# 附加到所有对象的 labels / annotations
commonLabels: {}
commonAnnotations: {}
