  #         - {secret: {namespace: devpod-system, name: devpod-gateway-internal-key}, kind: sshKeyPair}
  #       outputs:
  #         - {name: ssh, label: SSH 网关, kind: service, service: {namespace: devpod-system, name: devpod-gateway, port: 22}}
  #   - name: grafana
  #     spec:
  #       displayName: Grafana
  #       description: 指标看板
  #       chart: {repository: "oci://ghcr.io/grafana/helm-charts", name: grafana, version: 10.5.15}
  #       namespace: grafana
  #       release: grafana
  #       values: |
  #         admin: {existingSecret: grafana-admin, userKey: user, passwordKey: password}
  #         service: {type: LoadBalancer}
  #       generate:
  #         - {secret: {namespace: grafana, name: grafana-admin}, kind: password}
  #       outputs:
