  #         - {name: password, label: 管理员密码, kind: secret, secret: {namespace: grafana, name: grafana-admin, key: password}}
  #   - name: prometheus
  #     spec:
  #       displayName: Prometheus
  #       description: 指标采集（server + kube-state-metrics；cAdvisor 经节点代理，只含本集群容器）
