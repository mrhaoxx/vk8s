# vk8s Helm chart 配置。
# 平台配置段（apiDomain … limitRange）会原样渲染进 ConfigMap vk8s-config 的 config.yaml，
# 字段名与 internal/config.Config 的 json tag 一致。

image:
  repository: registry.corp.com/vk8s/vk8s
  # 空 = Chart.appVersion
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

namespace:
  # 由 chart 创建 Release namespace。通常用 `helm install --create-namespace` 代替，保持 false。
  create: false
  labels: {}

# ---- 域名与入口 ----
# kubectl 入口：*.<apiDomain> → gateway 的 LoadBalancer IP
apiDomain: vk8s.corp.com
# 用户从外部访问 <vc>.<apiDomain> 的端口，写进 kubeconfig 与 status.apiEndpoint；gateway 走 NodePort 时填映射后的端口
apiPort: 443
# 用户工作负载：*.<appsDomain> → 宿主 Ingress Controller 的 LB IP
appsDomain: apps.vk8s.corp.com
# 浏览器访问 UI 的地址（OIDC 回调也用它）。空 = https://console.<apiDomain>；manager.ingress.tls.enabled=false 时为 http://
# https 时 session cookie 带 Secure，浏览器走 http 不会回传，所以 scheme 必须与实际访问方式一致
publicURL: ""

# ---- 宿主集群网络 ----
# 必须与宿主一致；空 = manager 启动时自动探测
hostServiceCIDR: ""
hostPodCIDR: ""
# 空 = kube-system/kube-dns 的 ClusterIP
hostDNSServiceIP: ""
# 非 privileged 集群的 NetworkPolicy 放行 Ingress Controller 所在 ns
ingressNamespaceSelector:
  kubernetes.io/metadata.name: ingress-nginx
reservedNames:
  - console
  - api
  - www

# ---- 认证 ----
auth:
  sessionTTL: 24h
  bootstrapAdmin:
    enabled: true
    username: admin
    # 明文密码；空 = 首次安装随机生成并保存在 Secret 中（升级时复用已有值）
    password: ""
    # 已有 Secret（key: password）；设置后 chart 不再创建 Secret
    existingSecret: ""
  oidc:
    enabled: false
    issuer: ""
    clientID: ""
    # 明文 client secret；设置后 chart 创建 Secret（key: clientSecret）
    clientSecret: ""
    # 已有 Secret（key: clientSecret）；与 clientSecret 二选一
    existingSecret: ""
    usernameClaim: preferred_username
    emailClaim: email
    scopes:
      - openid
      - profile
      - email
    autoCreateUsers: true
    allowedEmailDomains: []

# ---- 平台上限 ----
limits:
  maxVClustersPerUser: 3
  tokenDefaultTTL: 720h
  tokenMaxTTL: 2160h

# ---- 节点预约 ----
booking:
  # 终态（已结束 / 已拒绝 / 已撤销）的预约保留多久后删除
  retention: 168h

# ---- 应用目录 ----
# 用户可在建集群时勾选、或在集群「应用」Tab 安装的 Helm chart（设计文档 2026-10-25 应用目录）。
# 每项渲染成一个集群级 AddonTemplate；也可以直接 kubectl apply AddonTemplate，两者等价。
# 安装由 vk8s-system 里跑平台镜像（内置 helm）的 Job 完成。
addons:
  job:
    timeout: 10m
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
  catalog: []
  # 示例（取消注释并按实际仓库改地址）：
  # catalog:
  #   - name: devpods
  #     spec:
  #       displayName: DevPods
