kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: nodebookings.vk8s.io
spec:
  group: vk8s.io
  names:
    kind: NodeBooking
    listKind: NodeBookingList
    plural: nodebookings
    shortNames:
    - nb
    singular: nodebooking
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.node
      name: Node
      type: string
    - jsonPath: .spec.vcluster
      name: VCluster
      type: string
    - jsonPath: .spec.start
      name: Start
      type: string
    - jsonPath: .spec.end
      name: End
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NodeBooking 节点预约（cluster-scoped）。ownerReference 指向目标 VirtualCluster。
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NodeBookingSpec 一次节点预约：把宿主节点 Node 在 [Start, End) 期间租给 VCluster。
              全部字段创建后不可变（见 NodeBooking.Spec 上的校验规则）。
            properties:
